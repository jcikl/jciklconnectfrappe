[build]
  command = "npm run build:web && npm run build:functions"
  publish = "apps/app/dist"

[functions]
  # Built by `npm run build:functions` from netlify/functions (see scripts/build-functions.mts).
  # Netlify always bundles v2 functions with NFT and keeps every package import external, so the
  # TypeScript workspace packages (@jci/core, @jci/doctypes) have to be bundled in beforehand.
  directory = "netlify/dist"

[dev]
  framework = "#static"
  publish = "apps/app/dist"
  port = 8888

# Single-page app: unknown paths serve the app shell. Functions with a config.path (/api/resource) match first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
